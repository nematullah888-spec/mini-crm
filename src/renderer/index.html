<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src http: https:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <title>برنامج العملاء</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="modern.css">
  <script src="theme.js"></script>
</head>
<body>
<div class="app">

  <!-- شريط القوائم -->
  <div class="menubar" id="menubar">
    <div class="menu">
      <button class="menu-btn">ملف</button>
      <div class="menu-list">
        <button data-cmd="new">عميل جديد<span class="key">Ctrl+N</span></button>
        <button data-cmd="export">تصدير إلى Excel…</button>
        <hr>
        <button data-cmd="openData">فتح مجلد البيانات</button>
        <hr>
        <button data-cmd="logout">تسجيل الخروج</button>
        <button data-cmd="quit">خروج</button>
      </div>
    </div>
    <div class="menu">
      <button class="menu-btn">تحرير</button>
      <div class="menu-list">
        <button data-cmd="edit">تعديل العميل<span class="key">Enter</span></button>
        <button data-cmd="delete">حذف العميل<span class="key">Del</span></button>
        <button data-cmd="addSub">إضافة اشتراك / تجديد…</button>
        <hr>
        <button data-cmd="find">بحث<span class="key">Ctrl+F</span></button>
      </div>
    </div>
    <div class="menu">
      <button class="menu-btn">عرض</button>
      <div class="menu-list">
        <button data-cmd="refresh">تحديث<span class="key">F5</span></button>
        <button data-cmd="alerts">تنبيهات الاشتراكات…</button>
        <hr>
        <button data-cmd="themeClassic" data-theme="classic">الشكل الكلاسيكي (ويندوز 98)</button>
        <button data-cmd="themeModern" data-theme="modern">الشكل الحديث (ويندوز 11)</button>
      </div>
    </div>
    <div class="menu">
      <button class="menu-btn">أدوات</button>
      <div class="menu-list">
        <button data-cmd="settings">الإعدادات والشبكة…</button>
      </div>
    </div>
    <div class="menu">
      <button class="menu-btn">الحساب</button>
      <div class="menu-list">
        <button data-cmd="account">تغيير كلمة المرور والبيانات…</button>
        <button data-cmd="smtp">إعداد الإيميل لاستعادة كلمة المرور…</button>
        <button data-cmd="recovery">إنشاء رمز استرداد جديد…</button>
        <hr>
        <button data-cmd="logout">تسجيل الخروج</button>
      </div>
    </div>
    <div class="menu">
      <button class="menu-btn">مساعدة</button>
      <div class="menu-list">
        <button data-cmd="about">حول البرنامج</button>
      </div>
    </div>
  </div>

  <!-- شريط الأدوات -->
  <div class="toolbar">
    <button class="tool" data-cmd="new"><span class="ico">➕</span>جديد</button>
    <button class="tool" data-cmd="edit"><span class="ico">✏️</span>تعديل</button>
    <button class="tool" data-cmd="delete"><span class="ico">🗑️</span>حذف</button>
    <span class="sep"></span>
    <button class="tool" data-cmd="addSub"><span class="ico">📅</span>اشتراك</button>
    <button class="tool alert-tool" data-cmd="alerts"><span class="ico">🔔</span>التنبيهات<b class="badge" id="alertBadge" hidden></b></button>
    <span class="sep"></span>
    <button class="tool" data-cmd="refresh"><span class="ico">🔄</span>تحديث</button>
    <button class="tool" data-cmd="export"><span class="ico">📊</span>تصدير</button>
    <span class="sep"></span>
    <button class="tool" data-cmd="settings"><span class="ico">⚙️</span>الإعدادات</button>
    <span class="grow"></span>
    <label class="search">
      بحث:
      <input type="text" id="search" placeholder="الاسم، الجوال، الشركة…">
    </label>
    <label class="search">
      التصنيف:
      <select id="filterCat"><option value="">الكل</option></select>
    </label>
    <label class="search">
      الاشتراك:
      <select id="filterSub">
        <option value="">الكل</option>
        <option value="soon">قرب الانتهاء</option>
        <option value="expired">منتهي</option>
        <option value="active">فعّال</option>
        <option value="under">أقل من سنة</option>
        <option value="none">بدون اشتراك</option>
      </select>
    </label>
  </div>

  <!-- المحتوى -->
  <div class="main">
    <fieldset class="group list-group">
      <legend>قائمة العملاء</legend>
      <div class="table-wrap sunken" id="tableWrap">
        <table class="grid" id="grid">
          <thead>
            <tr>
              <th data-sort="no">الرقم</th>
              <th data-sort="name">اسم العميل</th>
              <th data-sort="phone">الجوال</th>
              <th data-sort="company">الشركة</th>
              <th data-sort="city">المدينة</th>
              <th data-sort="product">الخدمة</th>
              <th data-sort="end">ينتهي في</th>
              <th data-sort="remaining">المتبقي</th>
              <th data-sort="category">التصنيف</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty"></div>
      </div>
    </fieldset>

    <fieldset class="group details-group">
      <legend>بيانات العميل</legend>
      <div id="details" class="details"></div>
    </fieldset>
  </div>

  <!-- شريط الحالة -->
  <div class="statusbar">
    <div class="panel" id="stUser">—</div>
    <div class="panel" id="stCount">—</div>
    <div class="panel" id="stMode">—</div>
    <div class="panel" id="stConn">—</div>
    <div class="panel" id="stAlerts">—</div>
    <div class="panel grow" id="stInfo"></div>
  </div>
</div>

<!-- شاشة تسجيل الدخول -->
<div class="auth" id="auth">
  <div class="window auth-win">
    <div class="title-bar">
      <span class="title-bar-text" id="authTitle">🔒 برنامج العملاء</span>
    </div>
    <div class="window-body" id="authBody">
      <div class="muted" style="padding:20px;text-align:center">جاري التحميل…</div>
    </div>
  </div>
</div>

<!-- النوافذ المنبثقة -->
<div class="overlay" id="overlay" hidden></div>

<template id="tplCustomer">
  <div class="window dlg-customer">
    <div class="title-bar">
      <span class="title-bar-text"></span>
      <button class="tb-close" data-close aria-label="إغلاق">✕</button>
    </div>
    <div class="window-body">
      <form class="form" autocomplete="off">
        <label>اسم العميل <b class="req">*</b></label><input name="name" required maxlength="120">
        <label>الجوال</label><input name="phone" maxlength="40" dir="ltr">
        <label>جوال آخر</label><input name="phone2" maxlength="40" dir="ltr">
        <label>البريد الإلكتروني</label><input name="email" maxlength="120" dir="ltr" type="email">
        <label>الشركة</label><input name="company" maxlength="120">
        <label>المدينة</label><input name="city" maxlength="60">
        <label>التصنيف</label><select name="category"></select>
        <label>العنوان</label><input name="address" maxlength="250">
        <label>ملاحظات</label><textarea name="notes" rows="5" maxlength="4000"></textarea>
        <div class="error" hidden></div>
        <div class="buttons">
          <button type="submit" class="btn default">حفظ</button>
          <button type="button" class="btn" data-close>إلغاء</button>
        </div>
      </form>
    </div>
  </div>
</template>

<template id="tplSub">
  <div class="window dlg-sub">
    <div class="title-bar">
      <span class="title-bar-text"></span>
      <button class="tb-close" data-close aria-label="إغلاق">✕</button>
    </div>
    <div class="window-body">
      <form class="form" autocomplete="off">
        <label>العميل</label><b class="sub-customer"></b>
        <label>الخدمة / البرنامج <b class="req">*</b></label><select name="product" required></select>
        <label>تاريخ البداية <b class="req">*</b></label><input name="start" type="date" required>
        <label>المدة</label>
        <select name="duration">
          <option value="12">سنة</option>
          <option value="6">6 أشهر</option>
          <option value="3">3 أشهر</option>
          <option value="1">شهر</option>
          <option value="custom">مدة أخرى (حدد تاريخ النهاية)</option>
        </select>
        <label>تاريخ النهاية <b class="req">*</b></label><input name="end" type="date" required>
        <label></label><div class="sub-summary"></div>
        <label>المبلغ (ريال)</label><input name="amount" type="number" min="0" step="0.01" dir="ltr">
        <label>ملاحظات</label><input name="notes" maxlength="500">
        <div class="error" hidden></div>
        <div class="buttons">
          <button type="submit" class="btn default">حفظ</button>
          <button type="button" class="btn" data-close>إلغاء</button>
        </div>
      </form>
    </div>
  </div>
</template>

<template id="tplAlerts">
  <div class="window dlg-alerts">
    <div class="title-bar">
      <span class="title-bar-text">🔔 تنبيهات الاشتراكات</span>
      <button class="tb-close" data-close aria-label="إغلاق">✕</button>
    </div>
    <div class="window-body">
      <div class="alerts-intro"></div>
      <div class="table-wrap sunken alerts-wrap">
        <table class="grid">
          <thead><tr><th>العميل</th><th>الجوال</th><th>الخدمة</th><th>ينتهي في</th><th>المتبقي</th><th></th></tr></thead>
          <tbody class="alerts-rows"></tbody>
        </table>
      </div>
      <div class="buttons">
        <button type="button" class="btn default" data-close>إغلاق</button>
      </div>
    </div>
  </div>
</template>

<template id="tplSettings">
  <div class="window dlg-settings">
    <div class="title-bar">
      <span class="title-bar-text">الإعدادات والشبكة</span>
      <button class="tb-close" data-close aria-label="إغلاق">✕</button>
    </div>
    <div class="window-body">
      <fieldset class="group">
        <legend>شكل البرنامج</legend>
        <label class="radio"><input type="radio" name="theme" value="classic">
          <span><b>كلاسيكي</b> — شكل ويندوز 98 القديم.</span></label>
        <label class="radio"><input type="radio" name="theme" value="modern">
          <span><b>حديث</b> — شكل ويندوز 11.</span></label>
      </fieldset>

      <fieldset class="group">
        <legend>طريقة التشغيل</legend>
        <label class="radio"><input type="radio" name="mode" value="local">
          <span><b>جهاز واحد</b> — البيانات محفوظة على هذا الجهاز فقط، بدون شبكة.</span></label>
        <label class="radio"><input type="radio" name="mode" value="server">
          <span><b>خادم (سيرفر)</b> — هذا الجهاز يحفظ البيانات، والأجهزة الثانية تتصل فيه.</span></label>
        <label class="radio"><input type="radio" name="mode" value="client">
          <span><b>عميل</b> — هذا الجهاز يتصل بجهاز الخادم ويشتغل على بياناته.</span></label>
      </fieldset>

      <fieldset class="group net">
        <legend>إعدادات الشبكة</legend>
        <div class="form small">
          <label class="only-client">عنوان جهاز الخادم (IP)</label>
          <input class="only-client" name="serverHost" dir="ltr" placeholder="192.168.1.10">
          <label>رقم المنفذ (Port)</label>
          <input name="port" type="number" min="1024" max="65535" dir="ltr">
          <label>رمز الشبكة</label>
          <input name="accessKey" type="password" placeholder="اختياري — نفس الرمز في كل الأجهزة">
        </div>
        <div class="hint only-server" id="ipHint"></div>
        <div class="hint only-client">
          اكتب عنوان جهاز الخادم كما يظهر في إعداداته، ثم اضغط «اختبار الاتصال».
          <button type="button" class="btn" id="btnTest">اختبار الاتصال</button>
          <span id="testResult"></span>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>الخدمات والتنبيهات (مشتركة بين كل الأجهزة)</legend>
        <div class="form small">
          <label>الخدمات / البرامج<br><small>(كل خدمة في سطر)</small></label>
          <textarea name="products" rows="4"></textarea>
          <label>التنبيه قبل الانتهاء بـ</label>
          <span><input name="alertDays" type="number" min="1" max="120" dir="ltr" style="width:70px"> يوم</span>
        </div>
      </fieldset>

      <div class="error settings-error" hidden></div>
      <div class="buttons">
        <button type="button" class="btn default" id="btnSaveSettings">حفظ وتطبيق</button>
        <button type="button" class="btn" data-close>إلغاء</button>
      </div>
    </div>
  </div>
</template>

<template id="tplAccount">
  <div class="window dlg-account">
    <div class="title-bar">
      <span class="title-bar-text">👤 تغيير كلمة المرور والبيانات</span>
      <button class="tb-close" data-close aria-label="إغلاق">✕</button>
    </div>
    <div class="window-body">
      <form class="form" autocomplete="off">
        <label>اسم المستخدم</label><input name="username" maxlength="40">
        <label>الإيميل (للاستعادة)</label><input name="email" type="email" dir="ltr" maxlength="120">
        <label>كلمة مرور جديدة</label><input name="newPassword" type="password" placeholder="اتركها فاضية إذا ما تبي تغيّرها">
        <label>تأكيد كلمة المرور</label><input name="confirm" type="password">
        <label>كلمة المرور الحالية <b class="req">*</b></label><input name="currentPassword" type="password" required>
        <div class="error" hidden></div>
        <div class="buttons">
          <button type="submit" class="btn default">حفظ</button>
          <button type="button" class="btn" data-close>إلغاء</button>
        </div>
      </form>
    </div>
  </div>
</template>

<template id="tplSmtp">
  <div class="window dlg-smtp">
    <div class="title-bar">
      <span class="title-bar-text">✉️ إعداد الإيميل لاستعادة كلمة المرور</span>
      <button class="tb-close" data-close aria-label="إغلاق">✕</button>
    </div>
    <div class="window-body">
      <div class="hint">
        إذا نسيت كلمة المرور، البرنامج يرسل لك رمز على إيميلك. عشان يقدر يرسل، يحتاج حساب Gmail يرسل منه (ممكن نفس إيميلك):
        <ol>
          <li>فعّل <b>التحقق بخطوتين</b> في حساب Google.</li>
          <li>ادخل <a href="https://myaccount.google.com/apppasswords" target="_blank">صفحة كلمات مرور التطبيقات</a> وسوّ كلمة مرور جديدة (16 حرف).</li>
          <li>اكتب الإيميل وكلمة مرور التطبيق هنا، واضغط «حفظ وإرسال تجربة».</li>
        </ol>
        الرمز بيوصل إلى: <b class="smtp-to" dir="ltr"></b>
      </div>
      <form class="form small" autocomplete="off" style="margin-top:10px">
        <label>مزوّد البريد</label>
        <select name="preset">
          <option value="gmail">Gmail</option>
          <option value="custom">آخر (إعداد يدوي)</option>
        </select>
        <label>إيميل الإرسال (Gmail)</label><input name="user" type="email" dir="ltr" placeholder="name@gmail.com">
        <label>كلمة مرور التطبيق</label><input name="pass" type="password" dir="ltr">
        <label class="smtp-adv">خادم البريد (SMTP)</label><input class="smtp-adv" name="host" dir="ltr">
        <label class="smtp-adv">المنفذ</label><input class="smtp-adv" name="port" type="number" dir="ltr">
        <div class="error" hidden></div>
        <div class="ok-msg" hidden></div>
        <div class="buttons">
          <button type="submit" class="btn default" data-test="1">حفظ وإرسال تجربة</button>
          <button type="button" class="btn" data-save-only>حفظ فقط</button>
          <button type="button" class="btn" data-close>إغلاق</button>
        </div>
      </form>
    </div>
  </div>
</template>

<template id="tplRecovery">
  <div class="window dlg-recovery">
    <div class="title-bar">
      <span class="title-bar-text">🔑 رمز استرداد جديد</span>
      <button class="tb-close" data-close aria-label="إغلاق">✕</button>
    </div>
    <div class="window-body">
      <form class="form" autocomplete="off">
        <div class="span muted">رمز الاسترداد يخليك تغيّر كلمة المرور بدون إنترنت إذا نسيتها. لما تسوي رمز جديد، الرمز القديم يوقف.</div>
        <label>كلمة المرور الحالية <b class="req">*</b></label><input name="currentPassword" type="password" required>
        <div class="error" hidden></div>
        <div class="buttons">
          <button type="submit" class="btn default">إنشاء الرمز</button>
          <button type="button" class="btn" data-close>إلغاء</button>
        </div>
      </form>
    </div>
  </div>
</template>

<template id="tplMsg">
  <div class="window dlg-msg">
    <div class="title-bar">
      <span class="title-bar-text"></span>
      <button class="tb-close" data-close aria-label="إغلاق">✕</button>
    </div>
    <div class="window-body">
      <div class="msg"><span class="msg-ico"></span><div class="msg-text"></div></div>
      <div class="buttons"></div>
    </div>
  </div>
</template>

<script src="subs.js"></script>
<script src="app.js"></script>
</body>
</html>
